<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>দেশি বাজার | Deshi Bazar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Tiro+Bangla&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFCF7; --card:#FFFFFF; --ink:#1D2340; --indigo:#2B3A7A; --indigo-dark:#1F2B5E;
  --madder:#A8322B; --jute:#C08A2E; --line:#E6DDCF; --muted:#625F70; --ok:#2F7A4B; --soft:#F3EEE4;
  color-scheme:light;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
body{font-family:'Hind Siliguri',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--paper);color:var(--ink);font-size:16px;line-height:1.6}
h1,h2,h3{font-family:'Tiro Bangla','Hind Siliguri',Georgia,serif;font-weight:400;line-height:1.25;margin:0 0 .5em}
h1{font-size:clamp(1.6rem,4vw,2.2rem)} h2{font-size:1.45rem} h3{font-size:1.15rem}
a{color:var(--indigo)}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--jute);outline-offset:2px}
.wrap{max-width:1140px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)}
.stitch{height:2px;background:repeating-linear-gradient(90deg,var(--madder) 0 12px,transparent 12px 20px);margin:0}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper)}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 0}
.brand{font-family:'Tiro Bangla',serif;font-size:1.5rem;color:var(--ink);text-decoration:none;line-height:1;margin-right:auto;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:'Hind Siliguri',sans-serif;font-size:.8rem;color:var(--muted)}
.iconlink{position:relative;text-decoration:none;color:var(--ink);font-weight:600;padding:6px 10px;border-radius:4px;white-space:nowrap}
.iconlink:hover{background:var(--soft)}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--madder);color:#fff;font-size:.75rem;line-height:20px;text-align:center;margin-left:4px}
.langbtn{border:1.5px solid var(--ink);background:transparent;color:var(--ink);font:inherit;font-weight:600;padding:4px 12px;border-radius:4px;cursor:pointer}
nav.main{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
nav.main a{text-decoration:none;color:var(--muted);padding:6px 12px;border-radius:4px;white-space:nowrap;font-weight:500}
nav.main a.active{color:var(--ink);background:var(--soft)}

main{padding:24px 0 48px;min-height:60vh}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--indigo);color:#fff;border:1.5px solid var(--indigo);padding:.55em 1.1em;border-radius:4px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;line-height:1.3}
.btn:hover{background:var(--indigo-dark)}
.btn.alt{background:transparent;color:var(--indigo)}
.btn.alt:hover{background:var(--soft)}
.btn.danger{background:var(--madder);border-color:var(--madder)}
.btn.sm{padding:.35em .8em;font-size:.9rem}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:4px;padding:.5em .7em;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--indigo);outline:none}
label{font-weight:600;font-size:.95rem;display:block;margin-bottom:4px}
.field{margin-bottom:14px}
.err{color:var(--madder);font-size:.88rem;margin-top:4px;min-height:0}
.field.bad input,.field.bad textarea,.field.bad select{border-color:var(--madder)}
.radios{display:flex;gap:10px;flex-wrap:wrap}
.radios label{font-weight:500;display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:4px;padding:8px 12px;cursor:pointer;margin:0;background:#fff}
.radios input{width:auto;margin:0}
.radios label:has(input:checked){border-color:var(--indigo);background:var(--soft)}

/* hero */
.hero{background:var(--indigo);color:#fff;border-radius:6px;padding:48px 40px;outline:2px dashed rgba(255,255,255,.5);outline-offset:-12px;display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:center}
.hero h1{font-size:clamp(2rem,6vw,3.4rem);margin-bottom:.3em}
.hero p{font-size:1.1rem;max-width:34ch;opacity:.92;margin:0 0 1.4em}
.hero .btn{background:var(--jute);border-color:var(--jute);color:var(--ink)}
.hero .btn:hover{background:#d39c3c}
.hero-art{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hero-art img{border-radius:4px;aspect-ratio:1;object-fit:cover;border:2px solid rgba(255,255,255,.25)}
.hero-art img:nth-child(2){transform:translateY(-14px)}
.hero-art img:nth-child(5){transform:translateY(-14px)}

.section{margin-top:40px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.sec-head h2{margin:0}
.sec-head a{font-weight:600;white-space:nowrap}

/* product grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.pimg{position:relative;display:block;aspect-ratio:1;background:var(--soft)}
.pimg img{width:100%;height:100%;object-fit:cover}
.tag{position:absolute;left:8px;top:8px;background:var(--ink);color:#fff;font-size:.78rem;padding:2px 8px;border-radius:3px}
.tag.out{background:var(--madder)}
.heart{position:absolute;right:8px;top:8px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:var(--madder);font-size:1.25rem;cursor:pointer;line-height:1}
.pbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
.pcat{font-size:.8rem;color:var(--muted)}
.pname{color:var(--ink);text-decoration:none;font-weight:600;line-height:1.35}
.pname:hover{text-decoration:underline}
.prow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:8px}
.price{font-size:1.1rem;color:var(--ink)}

/* filters */
.filters{display:grid;grid-template-columns:2fr 1.2fr 1fr 1fr 1.2fr auto;gap:10px;margin-bottom:12px;align-items:end}
.empty{grid-column:1/-1;text-align:center;padding:48px 16px;border:2px dashed var(--line);border-radius:6px;color:var(--muted)}
.empty .btn{margin-top:12px}

/* detail */
.detail{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}
.detail .photo{border-radius:6px;overflow:hidden;border:1px solid var(--line);background:var(--soft);aspect-ratio:1}
.detail .photo img{width:100%;height:100%;object-fit:cover}
.bigprice{font-size:2rem;font-family:'Tiro Bangla',serif;margin:.2em 0}
.stockline{font-weight:600}
.stockline.ok{color:var(--ok)} .stockline.low{color:var(--jute)} .stockline.out{color:var(--madder)}
.qty{display:inline-flex;border:1.5px solid var(--line);border-radius:4px;overflow:hidden;background:#fff}
.qty button{width:40px;border:0;background:var(--soft);font-size:1.2rem;cursor:pointer;color:var(--ink)}
.qty button:disabled{opacity:.4;cursor:not-allowed}
.qty input{width:56px;border:0;text-align:center;border-radius:0;-moz-appearance:textfield}
.qty input::-webkit-inner-spin-button{-webkit-appearance:none}
.qty span{display:inline-block;min-width:44px;text-align:center;line-height:38px;font-weight:600}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0}
.back{display:inline-block;margin-bottom:16px;font-weight:600;text-decoration:none}

/* cart */
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:28px;align-items:start}
.citem{display:grid;grid-template-columns:80px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.citem img{width:80px;height:80px;object-fit:cover;border-radius:4px;background:var(--soft)}
.citem .ctrl{display:flex;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap}
.linkbtn{background:none;border:0;color:var(--madder);font:inherit;font-weight:600;cursor:pointer;padding:4px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px}
.sumrow{display:flex;justify-content:space-between;gap:12px;padding:5px 0}
.sumrow.total{border-top:2px solid var(--ink);margin-top:8px;padding-top:10px;font-weight:700;font-size:1.15rem}
.sumrow.disc{color:var(--ok)}
.coupon{display:flex;gap:8px;margin:12px 0}
.note{font-size:.88rem;color:var(--muted)}

/* status */
.status{display:inline-block;padding:2px 10px;border-radius:3px;font-size:.85rem;font-weight:600;white-space:nowrap}
.s-Pending{background:#FBF0D9;color:#8A5A00}
.s-Confirmed{background:#E2E7F7;color:var(--indigo)}
.s-Shipped{background:#E6F0F7;color:#1F5878}
.s-Delivered{background:#E1F2E7;color:var(--ok)}
.s-Cancelled{background:#F8E3E1;color:var(--madder)}
.steps{display:flex;gap:4px;margin:12px 0 4px}
.steps div{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps div.done{background:var(--ok)}
.steplabels{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted)}

/* confirmation & invoice */
.confirm{text-align:center;padding:24px 0}
.confirm .ono{font-family:'Tiro Bangla',serif;font-size:2rem;color:var(--indigo)}
.invoice{background:#fff;border:1px solid var(--line);border-radius:6px;padding:24px;max-width:720px;margin:20px auto;text-align:left}
.inv-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:12px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.88rem;color:var(--muted);font-weight:600;white-space:nowrap}
td.num,th.num{text-align:right}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:#fff}
.tablewrap table td img{width:44px;height:44px;object-fit:cover;border-radius:4px}

/* admin */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs a{padding:8px 14px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a.active{color:var(--ink);border-color:var(--madder)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px}
.stat{border:1px solid var(--line);border-left:4px solid var(--indigo);border-radius:4px;padding:14px 16px;background:#fff}
.stat strong{display:block;font-family:'Tiro Bangla',serif;font-size:1.8rem;font-weight:400;line-height:1.2}
.stat span{color:var(--muted);font-size:.9rem}
.stat.madder{border-left-color:var(--madder)} .stat.jute{border-left-color:var(--jute)}
.bars{display:flex;flex-direction:column;gap:14px}
.bar-row{display:grid;grid-template-columns:110px 1fr auto;gap:12px;align-items:center}
.bar-track{height:26px;background:var(--soft);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width .5s ease}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.toolbar h2{margin:0}
td select{width:auto;padding:.3em .5em}

/* modal & toast */
.overlay{position:fixed;inset:0;background:rgba(29,35,64,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50}
.modal{background:var(--paper);border-radius:6px;padding:22px;width:100%;max-width:560px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:10px 18px;border-radius:4px;font-weight:500;animation:pop .2s ease}
.toast.err{background:var(--madder)}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

footer{border-top:1px solid var(--line);padding:20px 0;color:var(--muted);font-size:.9rem}

@media (max-width:860px){
  .hero{grid-template-columns:1fr;padding:36px 24px}
  .hero-art{display:none}
  .filters{grid-template-columns:1fr 1fr}
  .filters .fq{grid-column:1/-1}
  .detail,.two{grid-template-columns:1fr}
}
@media (max-width:480px){
  .grid{grid-template-columns:1fr 1fr;gap:10px}
  .pbody{padding:8px}
  .prow{flex-direction:column;align-items:stretch}
  .grid2{grid-template-columns:1fr}
  .brand small{display:none}
  .bar-row{grid-template-columns:80px 1fr;}
  .bar-row .bar-val{grid-column:2}
  .citem{grid-template-columns:64px 1fr}
  .citem img{width:64px;height:64px}
  .citem .linetotal{grid-column:2}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  body *{visibility:hidden}
  .invoice,.invoice *{visibility:visible}
  .invoice{position:absolute;left:0;top:0;width:100%;border:0;margin:0}
  .no-print{display:none!important}
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="topbar">
      <a href="#home" class="brand" id="brand"></a>
      <a href="#wishlist" class="iconlink" id="wishLink"></a>
      <a href="#cart" class="iconlink" id="cartLink"></a>
      <button class="langbtn" id="langBtn" onclick="toggleLang()"></button>
    </div>
    <nav class="main" id="nav"></nav>
  </div>
  <div class="stitch"></div>
</header>
<main class="wrap" id="app"></main>
<footer><div class="wrap" id="foot"></div></footer>
<div id="toast" aria-live="polite"></div>
<div id="modalRoot"></div>

<script>
/* ========== DATA ========== */
const SAMPLE = [

 {"id":2,"name_en":"Cotton Panjabi","name_bn":"সুতি পাঞ্জাবি","category":"Clothing","price":1200,"stock":12,"image":"https://picsum.photos/seed/panjabi/400/400"},
 {"id":3,"name_en":"Nakshi Kantha","name_bn":"নকশী কাঁথা","category":"Handicraft","price":3200,"stock":3,"image":"https://picsum.photos/seed/kantha/400/400"},
 {"id":4,"name_en":"Clay Pot Set","name_bn":"মাটির হাঁড়ি সেট","category":"Handicraft","price":850,"stock":20,"image":"https://picsum.photos/seed/pot/400/400"},
 {"id":5,"name_en":"Jute Bag","name_bn":"পাটের ব্যাগ","category":"Accessories","price":450,"stock":30,"image":"https://picsum.photos/seed/jute/400/400"},
 {"id":6,"name_en":"Bamboo Lamp","name_bn":"বাঁশের ল্যাম্প","category":"Handicraft","price":1500,"stock":0,"image":"https://picsum.photos/seed/lamp/400/400"},
 {"id":7,"name_en":"Leather Wallet","name_bn":"চামড়ার মানিব্যাগ","category":"Accessories","price":950,"stock":15,"image":"https://picsum.photos/seed/wallet/400/400"},
 {"id":8,"name_en":"Gamcha Set","name_bn":"গামছা সেট","category":"Clothing","price":350,"stock":40,"image":"https://picsum.photos/seed/gamcha/400/400"}
];
const CATS = ['Clothing','Handicraft','Accessories'];
const CAT_COLORS = {Clothing:'#2B3A7A',Handicraft:'#A8322B',Accessories:'#C08A2E'};
const STATUSES = ['Pending','Confirmed','Shipped','Delivered','Cancelled'];
const DELIVERY = {inside:60, outside:120};
const COUPONS = {DESHI10:10};
const PH = "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><rect width="400" height="400" fill="#F3EEE4"/><path d="M60 200h280M200 60v280" stroke="#A8322B" stroke-width="4" stroke-dasharray="14 10"/><circle cx="200" cy="200" r="70" fill="none" stroke="#2B3A7A" stroke-width="4" stroke-dasharray="14 10"/></svg>');

/* ========== BUILT-IN PRODUCT ILLUSTRATIONS (work offline) ========== */
// Each product gets a hand-drawn style SVG in the app's palette, framed by a kantha running-stitch border.
const C = {paper:'#FFFCF7', ink:'#1D2340', indigo:'#2B3A7A', indigoDk:'#1F2B5E', madder:'#A8322B', jute:'#C08A2E', juteDk:'#8A611A', green:'#2F7A4B', line:'#E6DDCF'};
function svgArt(bg, stitch, body){
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><rect width="400" height="400" fill="${bg}"/>` +
    `<rect x="16" y="16" width="368" height="368" rx="8" fill="none" stroke="${stitch}" stroke-width="3" stroke-dasharray="12 9" opacity=".45"/>` +
    body + `</svg>`);
}
const shadow = (cx, cy, rx) => `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="11" fill="${C.ink}" opacity=".12"/>`;
const ART = {
  // Jamdani saree: folded, white with woven diamond motifs, red border and draped pallu
  saree: (()=>{
    let motifs = '';
    for(let r=0; r<3; r++) for(let x=106 + (r%2)*16; x<=300; x+=32) motifs += `<path d="M${x} ${183+r*28}l7 7-7 7-7-7z" fill="${C.indigo}" opacity=".75"/>`;
    let zig = ''; for(let x=84, k=0; x<=316; x+=12, k++) zig += `${x},${k%2?296:284} `;
    return svgArt('#F3EEE4', C.madder, shadow(200,322,140) +
      `<rect x="92" y="136" width="216" height="24" rx="8" fill="#F1DCD7"/>` +
      `<rect x="78" y="150" width="244" height="164" rx="10" fill="#FFFFFF" stroke="${C.line}" stroke-width="2"/>` + motifs +
      `<path d="M78 270h244v34a10 10 0 0 1-10 10H88a10 10 0 0 1-10-10z" fill="${C.madder}"/>` +
      `<polyline points="${zig}" fill="none" stroke="${C.jute}" stroke-width="3"/>` +
      `<path d="M206 150h106a10 10 0 0 1 10 10v100z" fill="${C.madder}"/>` +
      `<path d="M222 157 L316 248" stroke="${C.jute}" stroke-width="3" stroke-dasharray="8 6"/>` +
      `<path d="M250 158 l6 6-6 6-6-6z M290 166 l6 6-6 6-6-6z M300 196 l6 6-6 6-6-6z" fill="${C.paper}" opacity=".8"/>`);
  })(),
  // Cotton panjabi: indigo kurta with placket, buttons and embroidered hem
  panjabi: svgArt('#F5EAD3', C.indigo, shadow(200,336,112) +
    `<path d="M168 86 Q200 106 232 86 L272 100 Q302 122 330 222 L304 232 L272 162 L272 328 L128 328 L128 162 L96 232 L70 222 Q98 122 128 100 Z" fill="${C.indigo}"/>` +
    `<path d="M75 206 L100 216 M325 206 L300 216" stroke="${C.jute}" stroke-width="3" stroke-dasharray="7 5"/>` +
    `<rect x="193" y="96" width="14" height="96" rx="3" fill="${C.indigoDk}"/>` +
    `<path d="M168 86 Q200 106 232 86 L228 78 Q200 96 172 78 Z" fill="${C.indigoDk}"/>` +
    `<circle cx="200" cy="116" r="4" fill="${C.jute}"/><circle cx="200" cy="140" r="4" fill="${C.jute}"/><circle cx="200" cy="164" r="4" fill="${C.jute}"/>` +
    `<path d="M136 314 H264" stroke="${C.jute}" stroke-width="3" stroke-dasharray="10 7"/>` +
    `<path d="M150 120 Q146 200 150 290" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none" opacity=".12"/>`),
  // Nakshi kantha: quilt with running-stitch frames, lotus centre and corner motifs
  kantha: (()=>{
    let petals = ''; for(let k=0; k<8; k++) petals += `<ellipse cx="200" cy="170" rx="10" ry="22" fill="${C.madder}" opacity=".85" transform="rotate(${k*45} 200 200)"/>`;
    const corners = [[132,132],[268,132],[132,268],[268,268]].map(([x,y])=>
      `<circle cx="${x}" cy="${y}" r="11" fill="none" stroke="${C.madder}" stroke-width="2.5" stroke-dasharray="5 4"/><circle cx="${x}" cy="${y}" r="3.5" fill="${C.indigo}"/>`).join('');
    return svgArt('#E4E8F5', C.indigo, shadow(200,338,130) +
      `<g transform="rotate(-5 200 200)">` +
      `<rect x="76" y="76" width="248" height="248" rx="6" fill="${C.paper}" stroke="${C.madder}" stroke-width="10"/>` +
      `<rect x="98" y="98" width="204" height="204" fill="none" stroke="${C.indigo}" stroke-width="2.5" stroke-dasharray="7 6"/>` +
      `<rect x="112" y="112" width="176" height="176" fill="none" stroke="${C.jute}" stroke-width="2.5" stroke-dasharray="7 6"/>` +
      `<circle cx="200" cy="200" r="50" fill="none" stroke="${C.indigo}" stroke-width="2.5" stroke-dasharray="6 5"/>` +
      petals + `<circle cx="200" cy="200" r="13" fill="${C.jute}"/>` + corners + `</g>`);
  })(),

/* Sample orders: added once on first open so the dashboard has data from the start.
   They do NOT reduce stock, and are flagged sample:true so status changes never touch stock either. */
function seedOrders(){
  if(store.get('seeded', false) || state.orders.length) return;
  const DAY = 864e5, now = Date.now();
  const mk = (n, daysAgo, name, phone, address, area, payment, trx, lines, status, coupon='') => {
    const items = lines.map(([id,qty])=>{ const p = SAMPLE.find(x=>x.id===id);
      return {id:p.id, name_en:p.name_en, name_bn:p.name_bn, category:p.category, price:p.price, qty}; });
    const subtotal = items.reduce((s,i)=>s + i.price*i.qty, 0);
    const discount = coupon ? Math.round(subtotal*COUPONS[coupon]/100) : 0;
    const delivery = DELIVERY[area];
    return {id:'DB-'+(1000+n), date:new Date(now - daysAgo*DAY).toISOString(), name, phone, address, area, payment, trx,
            items, subtotal, discount, coupon, delivery, total: subtotal - discount + delivery, status, sample:true};
  };
  state.orders = [
    mk(1, 6, 'Sample Customer A', '01700000001', 'House 1, Road 1, Dhanmondi, Dhaka', 'inside',  'cod',   '',         [[1,1],[5,2]], 'Delivered'),
    mk(2, 4, 'Sample Customer B', '01800000002', 'Ward 3, Sadar, Rajshahi',          'outside', 'bkash', 'SMPL0002', [[3,1],[4,1]], 'Shipped', 'DESHI10'),
    mk(3, 3, 'Sample Customer C', '01900000003', 'Block C, Mirpur 10, Dhaka',        'inside',  'cod',   '',         [[2,2],[8,3]], 'Confirmed'),
    mk(4, 2, 'Sample Customer E', '01600000005', 'Sector 7, Uttara, Dhaka',          'inside',  'cod',   '',         [[4,2]],       'Cancelled'),
    mk(5, 1, 'Sample Customer D', '01500000004', 'College Road, Zindabazar, Sylhet', 'outside', 'bkash', 'SMPL0004', [[7,1],[5,1]], 'Pending')
  ];
  save('orders'); store.set('seeded', true);
}

/* ========== HELPERS ========== */
const $ = s => document.querySelector(s);
const app = $('#app');
function t(k,...a){ const v=(T[state.lang][k] ?? T.en[k] ?? k); return typeof v==='function'? v(...a) : v; }
function num(n){ return Number(n).toLocaleString(state.lang==='bn'?'bn-BD':'en-US'); }
function money(n){ return '৳' + num(n); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function prod(id){ return state.products.find(p=>p.id===Number(id)); }
function pn(p){ return state.lang==='bn' ? (p.name_bn||p.name_en) : (p.name_en||p.name_bn); }
function itemName(i){ return state.lang==='bn' ? i.name_bn : i.name_en; }
function pdesc(p){ return (state.lang==='bn'?p.desc_bn:p.desc_en) || t('desc_'+p.category); }
function catName(c){ return t('cat_'+c); }
function stName(s){ return t('st_'+s); }
function imgFail(img){ img.onerror=null; img.src=PH; }
function fmtDate(d){ return new Date(d).toLocaleString(state.lang==='bn'?'bn-BD':'en-GB',{dateStyle:'medium',timeStyle:'short'}); }
function toEnDigits(s){ return String(s).replace(/[০-৯]/g, d=>String(d.charCodeAt(0)-2534)); }
function normPhone(s){ let p=toEnDigits(s).replace(/[\s\-()]/g,''); if(p.startsWith('+880')) p=p.slice(3); else if(p.startsWith('880')) p=p.slice(2); return p; }
const PHONE_RE = /^01[3-9]\d{8}$/;
function toast(msg,type=''){ const el=document.createElement('div'); el.className='toast '+type; el.textContent=msg; $('#toast').appendChild(el); setTimeout(()=>el.remove(),2600); }
function soldCount(id){ return state.orders.filter(o=>o.status!=='Cancelled').reduce((s,o)=>s+o.items.filter(i=>i.id===id).reduce((a,i)=>a+i.qty,0),0); }

function setCat(c){
  F.cat = c;

  drawGrid();

// Any link to plain "#products" (menu, banner, empty states) means "all products": reset the category filter.
document.addEventListener('click', e=>{
  const a = e.target.closest('a[href="#products"]'); if(!a) return;
  e.preventDefault();
  F.cat = 'all';
  if(location.hash !== '#products') history.pushState(null, '', '#products');

});
function drawGrid(){
  const q = F.q.trim().toLowerCase();
  const min = F.min==='' ? null : Number(toEnDigits(F.min)), max = F.max==='' ? null : Number(toEnDigits(F.max));
  let list = state.products.filter(p=>
    (!q || p.name_en.toLowerCase().includes(q) || p.name_bn.includes(q)) &&
    (F.cat==='all' || p.category===F.cat) &&
    (min===null || p.price>=min) && (max===null || p.price<=max));
  if(F.sort==='low') list.sort((a,b)=>a.price-b.price);
  if(F.sort==='high') list.sort((a,b)=>b.price-a.price);
  $('#count').textContent = t('found', list.length);
  $('#grid').innerHTML = list.length ? list.map(card).join('') : `<div class="empty">${t('noResults')}<br><button class="btn alt" onclick="resetFilters()">${t('clear')}</button></div>`;
}

function stepQty(d){
  const el = $('#dq'); const max = Number(el.max)||0;
  let v = (parseInt(toEnDigits(el.value))||1) + d;
  if(v > max){ v = max; toast(t('stockLimit', max), 'err'); }
  el.value = Math.max(1, v);
}

/* ========== CART LOGIC ========== */
function addToCart(id, qty){
  const p = prod(id); if(!p || p.stock<=0) return toast(t('outOfStock'),'err');
  qty = Math.max(1, parseInt(toEnDigits(qty))||1);
  const it = state.cart.find(i=>i.id===p.id); const cur = it ? it.qty : 0;
  if(cur + qty > p.stock){ toast(t('stockLimit', p.stock), 'err'); if(cur >= p.stock) return; qty = p.stock - cur; }
  if(it) it.qty += qty; else state.cart.push({id:p.id, qty});
  save('cart'); updateBadges(); toast(t('added'));
}
function changeQty(id, d){
  const it = state.cart.find(i=>i.id===id); const p = prod(id); if(!it||!p) return;
  const nq = it.qty + d;
  if(nq < 1) return;
  if(nq > p.stock) return toast(t('stockLimit', p.stock), 'err');
  it.qty = nq; save('cart'); renderCart();
}
function removeItem(id){ state.cart = state.cart.filter(i=>i.id!==id); save('cart'); renderCart(); }
function cleanCart(){
  let changed = false;
  state.cart = state.cart.filter(i=>{ const p=prod(i.id); if(!p||p.stock<=0){ changed=true; return false; }
    if(i.qty>p.stock){ i.qty=p.stock; changed=true; } return true; });
  if(changed){ save('cart'); updateBadges(); }
  return changed;
}
function totals(){
  const sub = state.cart.reduce((s,i)=>s + prod(i.id).price*i.qty, 0);
  const disc = state.coupon && COUPONS[state.coupon] ? Math.round(sub*COUPONS[state.coupon]/100) : 0;
  const del = state.cart.length ? DELIVERY[state.area] : 0;
  return {sub, disc, del, total: sub - disc + del};
}
function setArea(a){ state.area = a; save('area'); const s=$('#sum'); if(s) s.innerHTML = summaryHTML(); }
function applyCoupon(){
  const code = $('#cc').value.trim().toUpperCase();
  if(COUPONS[code]){ state.coupon = code; save('coupon'); toast(t('couponOk', code)); }
  else { toast(t('couponBad'), 'err'); }
  renderCart();
}
function removeCoupon(){ state.coupon=''; save('coupon'); renderCart(); }
function summaryHTML(){
  const x = totals();
  return `<div class="sumrow"><span>${t('subtotal')}</span><span>${money(x.sub)}</span></div>
  ${x.disc?`<div class="sumrow disc"><span>${t('discount')} (${esc(state.coupon)})</span><span>−${money(x.disc)}</span></div>`:''}
  <div class="sumrow"><span>${t('delivery')} · ${state.area==='inside'?t('insideShort'):t('outsideShort')}</span><span>${money(x.del)}</span></div>
  <div class="sumrow total"><span>${t('total')}</span><span>${money(x.total)}</span></div>`;

      <div class="field"><label>${t('payment')}</label><div class="radios">
        <label><input type="radio" name="pay" value="cod" checked onchange="toggleTrx()"> ${t('cod')}</label>
        <label><input type="radio" name="pay" value="bkash" onchange="toggleTrx()"> ${t('bkash')}</label></div></div>
      <div class="field" id="f-trx" hidden><label for="ctrx">${t('trx')}</label><input id="ctrx" maxlength="10"><div class="note">${t('trxHint')}</div><div class="err"></div></div>
      <button class="btn block" type="submit">${t('placeOrder')}</button>
    </form>
    <aside class="panel"><h3>${t('orderSummary')}</h3>
      ${state.cart.map(i=>{ const p=prod(i.id); return `<div class="sumrow"><span>${esc(pn(p))} × ${num(i.qty)}</span><span>${money(p.price*i.qty)}</span></div>`; }).join('')}
      <hr style="border:0;border-top:1px solid var(--line)">
      <div id="sum">${summaryHTML()}</div>
    </aside>
  </div>`;
}
function toggleTrx(){ $('#f-trx').hidden = document.querySelector('input[name=pay]:checked').value!=='bkash'; }
function setErr(id, msg){ const f=$('#f-'+id); f.classList.toggle('bad', !!msg); f.querySelector('.err').textContent = msg||''; }
function placeOrder(e){
  e.preventDefault();
  const name = $('#cname').value.trim(), phone = normPhone($('#cphone').value), address = $('#caddr').value.trim();
  const pay = document.querySelector('input[name=pay]:checked').value, trx = $('#ctrx').value.trim().toUpperCase();
  let ok = true;
  const chk = (id, bad, msg)=>{ setErr(id, bad?msg:''); if(bad) ok=false; };
  chk('name', name.length<3, t('errName'));
  chk('phone', !PHONE_RE.test(phone), t('errPhone'));
  chk('address', address.length<10, t('errAddress'));
  chk('trx', pay==='bkash' && !/^[A-Z0-9]{8,10}$/.test(trx), t('errTrx'));
  if(!ok){ const first=document.querySelector('.field.bad input, .field.bad textarea'); if(first) first.focus(); return; }
  if(cleanCart()){ toast(t('stockChanged'),'err'); location.hash='#cart'; return; }
  const x = totals();
  const order = {
    id: 'DB-' + (Math.max(1000, ...state.orders.map(o=>parseInt(o.id.slice(3))||0)) + 1), date: new Date().toISOString(),
    name, phone, address, area: state.area, payment: pay, trx: pay==='bkash'?trx:'',
    items: state.cart.map(i=>{ const p=prod(i.id); return {id:p.id, name_en:p.name_en, name_bn:p.name_bn, category:p.category, price:p.price, qty:i.qty}; }),
    subtotal: x.sub, discount: x.disc, coupon: x.disc?state.coupon:'', delivery: x.del, total: x.total, status: 'Pending'
  };
  order.items.forEach(i=>{ prod(i.id).stock -= i.qty; });
  state.orders.push(order); state.cart = []; state.coupon = '';
  ['orders','cart','coupon','products'].forEach(save);
  location.hash = '#order/' + order.id;
}

/* ========== ORDER CONFIRMATION + INVOICE ========== */
function invoiceHTML(o){
  return `<div class="invoice">
    <div class="inv-head"><div><h2 style="margin:0">${t('brand')}</h2><div class="muted">${t('invoice')} · ${esc(o.id)}</div></div>
      <div style="text-align:right"><div>${t('date')}: ${fmtDate(o.date)}</div><span class="status s-${o.status}">${stName(o.status)}</span></div></div>
    <p><strong>${t('customer')}:</strong> ${esc(o.name)} · ${esc(o.phone)}<br>${esc(o.address)} (${o.area==='inside'?t('insideShort'):t('outsideShort')})<br>
      <strong>${t('paymentLabel')}:</strong> ${t(o.payment)}${o.trx?` · ${t('trxShort')}: ${esc(o.trx)}`:''}</p>
    <div class="tablewrap"><table><thead><tr><th>${t('item')}</th><th class="num">${t('unit')}</th><th class="num">${t('qty')}</th><th class="num">${t('lineTotal')}</th></tr></thead>
    <tbody>${o.items.map(i=>`<tr><td>${esc(itemName(i))}</td><td class="num">${money(i.price)}</td><td class="num">${num(i.qty)}</td><td class="num">${money(i.price*i.qty)}</td></tr>`).join('')}</tbody></table></div>
    <div style="max-width:320px;margin:12px 0 0 auto">
      <div class="sumrow"><span>${t('subtotal')}</span><span>${money(o.subtotal)}</span></div>
      ${o.discount?`<div class="sumrow disc"><span>${t('discount')} (${esc(o.coupon)})</span><span>−${money(o.discount)}</span></div>`:''}
      <div class="sumrow"><span>${t('delivery')}</span><span>${money(o.delivery)}</span></div>
      <div class="sumrow total"><span>${t('total')}</span><span>${money(o.total)}</span></div></div>
  </div>`;
}
function renderOrder(id){
  const o = state.orders.find(x=>x.id===id);
  if(!o){ app.innerHTML = `<div class="empty">${t('orderNotFound')}<br><a href="#track" class="btn">${t('track')}</a></div>`; return; }
  app.innerHTML = `<div class="confirm no-print"><h1>${t('thanks')}</h1>
    <div class="muted">${t('orderNo')}</div><div class="ono">${esc(o.id)}</div><p class="muted">${t('keepNo')}</p></div>
    ${invoiceHTML(o)}
    <div class="actions no-print" style="justify-content:center"><button class="btn" onclick="window.print()">${t('printInvoice')}</button>
      <a href="#products" class="btn alt">${t('continueShopping')}</a></div>`;
}

/* ========== WISHLIST ========== */
function toggleWish(id){
  if(state.wish.includes(id)){ state.wish = state.wish.filter(x=>x!==id); toast(t('wishRemoved')); }
  else { state.wish.push(id); toast(t('wishAdded')); }
  save('wish'); route();
}
function renderWishlist(){
  state.wish = state.wish.filter(id=>prod(id)); save('wish');
  const list = state.wish.map(prod);
  app.innerHTML = `<h1>${t('wishlist')}</h1>` + (list.length ? `<div class="grid">${list.map(card).join('')}</div>`
    : `<div class="empty">${t('wishEmpty')}<br><a href="#products" class="btn">${t('shopNow')}</a></div>`);
}

/* ========== TRACK ========== */
let lastTrack = '';
function renderTrack(){
  app.innerHTML = `<h1>${t('trackTitle')}</h1><p class="muted">${t('trackText')}</p>
  <div class="coupon" style="max-width:460px"><input id="tp" type="tel" inputmode="numeric" placeholder="01XXXXXXXXX" value="${esc(lastTrack)}" onkeydown="if(event.key==='Enter')trackSearch()">
  <button class="btn" onclick="trackSearch()">${t('find')}</button></div><div id="tr"></div>`;
  if(lastTrack) trackSearch();
}
function trackSearch(){
  const ph = normPhone($('#tp').value); lastTrack = $('#tp').value;
  if(!PHONE_RE.test(ph)){ $('#tr').innerHTML = `<p class="err">${t('errPhone')}</p>`; return; }
  const list = state.orders.filter(o=>o.phone===ph).reverse();
  if(!list.length){ $('#tr').innerHTML = `<div class="empty">${t('noOrders')}</div>`; return; }
  const flow = STATUSES.slice(0,4);
  $('#tr').innerHTML = list.map(o=>{ const idx = flow.indexOf(o.status);
    return `<div class="panel" style="margin-top:14px">
      <div class="toolbar" style="margin:0"><strong>${esc(o.id)}</strong><span class="status s-${o.status}">${stName(o.status)}</span></div>
      <div class="note">${fmtDate(o.date)} · ${o.items.map(i=>esc(itemName(i))+' × '+num(i.qty)).join(', ')}</div>
      ${o.status==='Cancelled'?'':`<div class="steps">${flow.map((s,k)=>`<div class="${k<=idx?'done':''}"></div>`).join('')}</div>
      <div class="steplabels">${flow.map(s=>`<span>${stName(s)}</span>`).join('')}</div>`}
      <div class="toolbar" style="margin:10px 0 0"><strong>${t('total')}: ${money(o.total)}</strong><a href="#order/${encodeURIComponent(o.id)}">${t('invoice')}</a></div>
    </div>`; }).join('');
}

/* ========== ADMIN ========== */
function renderAdmin(tab='dashboard'){
  const tabs = [['dashboard',t('dashboard')],['products',t('manageProducts')],['orders',t('orders')]];
  app.innerHTML = `<h1>${t('admin')}</h1>
  <div class="tabs">${tabs.map(([k,l])=>`<a href="#admin/${k}" class="${tab===k?'active':''}">${l}</a>`).join('')}</div>
  <div id="adm"></div>`;
  ({dashboard:adminDashboard, products:adminProducts, orders:adminOrders}[tab] || adminDashboard)();
}
function adminDashboard(){
  const valid = state.orders.filter(o=>o.status!=='Cancelled');
  const sales = valid.reduce((s,o)=>s+o.total,0);
  const pending = state.orders.filter(o=>o.status==='Pending').length;
  const catSales = CATS.map(c=>({c, v: valid.reduce((s,o)=>s+o.items.filter(i=>i.category===c).reduce((a,i)=>a+i.price*i.qty,0),0)}));
  const maxV = Math.max(1, ...catSales.map(x=>x.v));
  const low = state.products.filter(p=>p.stock<=3);
  $('#adm').innerHTML = `
  <div class="stats">
    <div class="stat"><strong>${money(sales)}</strong><span>${t('totalSales')}</span></div>
    <div class="stat madder"><strong>${num(state.orders.length)}</strong><span>${t('totalOrders')}</span></div>
    <div class="stat jute"><strong>${num(pending)}</strong><span>${t('pendingOrders')}</span></div>
    <div class="stat"><strong>${num(state.products.length)}</strong><span>${t('productsCount')}</span></div>
  </div>
  <div class="two">
    <div class="panel"><h3>${t('salesByCat')}</h3>
      <div class="bars" role="img" aria-label="${t('salesByCat')}">${catSales.map(x=>`<div class="bar-row">
        <span>${catName(x.c)}</span><div class="bar-track"><div class="bar-fill" style="width:${(x.v/maxV*100).toFixed(1)}%;background:${CAT_COLORS[x.c]}"></div></div>
        <strong class="bar-val">${money(x.v)}</strong></div>`).join('')}</div>
      <p class="note" style="margin-top:12px">${t('salesNote')}</p></div>
    <div class="panel"><h3>${t('lowStockTitle')}</h3>
      ${low.length ? low.map(p=>`<div class="sumrow"><span>${esc(pn(p))}</span><strong style="color:${p.stock?'var(--jute)':'var(--madder)'}">${num(p.stock)}</strong></div>`).join('') : `<p class="muted">${t('none')}</p>`}</div>
  </div>`;
}
function adminProducts(){
  $('#adm').innerHTML = `<div class="toolbar"><h2>${t('manageProducts')} (${num(state.products.length)})</h2>
    <button class="btn" onclick="openProductForm()">${t('addProduct')}</button></div>
  <div class="tablewrap"><table><thead><tr><th></th><th>${t('item')}</th><th>${t('category')}</th><th class="num">${t('price')}</th><th class="num">${t('stock')}</th><th>${t('actions')}</th></tr></thead>
  <tbody>${state.products.map(p=>`<tr><td><img src="${esc(imgSrc(p))}" alt="" onerror="imgFail(this)"></td>
    <td><strong>${esc(p.name_bn)}</strong><br><span class="note">${esc(p.name_en)}</span></td><td>${catName(p.category)}</td>
    <td class="num">${money(p.price)}</td><td class="num" style="color:${p.stock<=0?'var(--madder)':'inherit'}">${num(p.stock)}</td>
    <td style="white-space:nowrap"><button class="btn alt sm" onclick="openProductForm(${p.id})">${t('edit')}</button>
      <button class="btn danger sm" onclick="deleteProduct(${p.id})">${t('delete')}</button></td></tr>`).join('')}</tbody></table></div>`;
}
function openProductForm(id){
  const p = id ? prod(id) : {name_en:'',name_bn:'',category:'Clothing',price:'',stock:'',image:'',desc_en:'',desc_bn:''};
  const f = (key,label,type='text',extra='')=>`<div class="field" id="f-${key}"><label for="p-${key}">${label}</label><input id="p-${key}" type="${type}" value="${esc(p[key])}" ${extra}><div class="err"></div></div>`;
  $('#modalRoot').innerHTML = `<div class="overlay" onclick="if(event.target===this)closeModal()"><form class="modal" novalidate onsubmit="saveProduct(event, ${id||0})" role="dialog" aria-modal="true">
    <h2>${id?t('editProduct'):t('addProduct')}</h2>
    <div class="grid2">${f('name_en',t('nameEn'))}${f('name_bn',t('nameBn'))}</div>
    <div class="grid2"><div class="field"><label for="p-category">${t('category')}</label><select id="p-category">${CATS.map(c=>`<option value="${c}" ${p.category===c?'selected':''}>${catName(c)}</option>`).join('')}</select></div>
      <div class="field" id="f-image"><label for="p-image">${t('image')}</label>
        <input id="p-image" type="url" value="${String(p.image||'').startsWith('art:')||String(p.image||'').startsWith('data:')?'':esc(p.image)}" placeholder="https://">
        ${String(p.image||'').startsWith('art:')?`<div class="note">${t('imageHint')}</div>`:''}<div class="err"></div></div></div>
    <div class="grid2">${f('price',t('price'),'number','min="1"')}${f('stock',t('stock'),'number','min="0"')}</div>
    <div class="field"><label for="p-desc_en">${t('descEn')}</label><textarea id="p-desc_en" rows="2">${esc(p.desc_en)}</textarea></div>
    <div class="field"><label for="p-desc_bn">${t('descBn')}</label><textarea id="p-desc_bn" rows="2">${esc(p.desc_bn)}</textarea></div>
    <div class="actions" style="justify-content:flex-end;margin-bottom:0"><button type="button" class="btn alt" onclick="closeModal()">${t('cancel')}</button><button class="btn" type="submit">${t('save')}</button></div>
  </form></div>`;
  $('#p-name_en').focus();
}
function closeModal(){ $('#modalRoot').innerHTML=''; }
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });
function saveProduct(e, id){
  e.preventDefault();
  const v = k => $('#p-'+k).value.trim();
  const data = {name_en:v('name_en'), name_bn:v('name_bn'), category:v('category'), image:v('image'),
    price:Number(toEnDigits(v('price'))), stock:Number(toEnDigits(v('stock'))), desc_en:v('desc_en'), desc_bn:v('desc_bn')};
  let ok = true; const chk=(k,bad,msg)=>{ setErr(k, bad?msg:''); if(bad) ok=false; };
  chk('name_en', !data.name_en, t('errRequired'));
  chk('name_bn', !data.name_bn, t('errRequired'));
  chk('price', !(data.price>0), t('errPrice'));
  chk('stock', v('stock')==='' || !(Number.isInteger(data.stock) && data.stock>=0), t('errStock'));
  if(!ok) return;
  if(!data.image) data.image = (id && (prod(id).image||'').startsWith('art:')) ? prod(id).image : ''; // blank keeps the built-in illustration; otherwise imgSrc() shows the placeholder
  if(id){ Object.assign(prod(id), data); }
  else { data.id = Math.max(0, ...state.products.map(p=>p.id)) + 1; state.products.push(data); }
  save('products'); closeModal(); toast(t('productSaved')); adminProducts();
}
function deleteProduct(id){
  const p = prod(id); if(!confirm(t('confirmDelete', pn(p)))) return;
  state.products = state.products.filter(x=>x.id!==id);
  state.cart = state.cart.filter(i=>i.id!==id); state.wish = state.wish.filter(x=>x!==id);
  ['products','cart','wish'].forEach(save); updateBadges(); toast(t('productDeleted')); adminProducts();
}
function adminOrders(){
  if(!state.orders.length){ $('#adm').innerHTML = `<div class="empty">${t('noOrdersYet')}</div>`; return; }
  $('#adm').innerHTML = `<div class="toolbar"><h2>${t('orders')} (${num(state.orders.length)})</h2>
    <button class="btn alt" onclick="exportCSV()">${t('exportCsv')}</button></div>
  <div class="tablewrap"><table><thead><tr><th>${t('orderNo')}</th><th>${t('date')}</th><th>${t('customer')}</th><th>${t('items')}</th><th class="num">${t('total')}</th><th>${t('paymentLabel')}</th><th>${t('status')}</th><th></th></tr></thead>
  <tbody>${[...state.orders].reverse().map(o=>`<tr><td><strong>${esc(o.id)}</strong>${o.sample?`<br><span class="note">${t('sample')}</span>`:''}</td><td style="white-space:nowrap">${fmtDate(o.date)}</td>
    <td>${esc(o.name)}<br><span class="note">${esc(o.phone)} · ${o.area==='inside'?t('insideShort'):t('outsideShort')}</span></td>
    <td>${o.items.map(i=>esc(itemName(i))+' × '+num(i.qty)).join('<br>')}</td><td class="num">${money(o.total)}</td>
    <td>${t(o.payment)}${o.trx?`<br><span class="note">${t('trxShort')}: ${esc(o.trx)}</span>`:''}</td>
    <td><select onchange="setStatus('${o.id}', this.value, this)" aria-label="${t('status')}">${STATUSES.map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${stName(s)}</option>`).join('')}</select></td>
    <td><a href="#order/${encodeURIComponent(o.id)}">${t('view')}</a></td></tr>`).join('')}</tbody></table></div>`;
}
function exportCSV(){
  // Free-text cells: quote, and neutralise leading = + - @ so a spreadsheet never runs them as formulas
  const cell = v => { if(v && v.raw) return v.raw; let s = String(v ?? ''); if(/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g,'""') + '"'; };
  const pad = n => String(n).padStart(2,'0');
  const stamp = iso => { const d = new Date(iso); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const rows = [t('csvHead'), ...state.orders.map(o=>[
    o.id, stamp(o.date), o.name,
    {raw: ['"=', o.phone, '"'].join('""')}, // phone is validated digits only; ="017..." keeps the leading 0 in Excel
    o.address, o.area==='inside'?t('insideShort'):t('outsideShort'), t(o.payment), o.trx,
    o.items.map(i=>`${itemName(i)} x ${i.qty}`).join('; '),
    o.subtotal, o.discount, o.coupon, o.delivery, o.total, stName(o.status)
  ])];
  const csv = '\uFEFF' + rows.map(r=>r.map(cell).join(',')).join('\r\n'); // BOM so Excel shows Bangla correctly
  const url = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  const a = document.createElement('a'); a.href = url;
  a.download = `deshi-bazar-orders-${stamp(new Date().toISOString()).slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 1000);
  toast(t('csvDone'));
}
function setStatus(id, ns, sel){
  const o = state.orders.find(x=>x.id===id); const old = o.status; if(old===ns) return;
  if(!o.sample){ // sample orders never reduced stock, so they never restore or re-deduct it
    if(ns==='Cancelled'){ o.items.forEach(i=>{ const p=prod(i.id); if(p) p.stock += i.qty; }); }
    else if(old==='Cancelled'){
      if(o.items.some(i=>{ const p=prod(i.id); return !p || p.stock < i.qty; })){ toast(t('reopenFail'),'err'); sel.value = old; return; }
      o.items.forEach(i=>{ prod(i.id).stock -= i.qty; });
    }
  }
  o.status = ns; save('orders'); save('products'); toast(t('statusUpdated'));
}

/* ========== START ========== */
route();
</script>
